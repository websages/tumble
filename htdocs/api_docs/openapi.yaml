openapi: 3.0.0
info:
  title: Tumble API
  description: API documentation for the Tumble application.
  version: 1.0.0
servers:
  - url: /
paths:
  /index.cgi:
    get:
      summary: Get Tumble Feed
      description: Retrieves the main content feed (Tumblelog).
      parameters:
        - name: i
          in: query
          description: Pagination offset. (i * 6 days ago)
          schema:
            type: integer
        - name: dtype
          in: query
          description: Output format.
          schema:
            type: string
            enum: [html, rss, xml]
            default: html
      responses:
        '200':
          description: Successful response
          content:
            text/html:
              schema:
                type: string
            application/rss+xml:
              schema:
                type: string
            text/xml:
              schema:
                type: string

  /search.cgi:
    get:
      summary: Search Tumble Content
      description: Search for content within the Tumblelog.
      parameters:
        - name: search
          in: query
          description: Search term (must be at least 4 characters).
          required: true
          schema:
            type: string
        - name: dtype
          in: query
          description: Output format (sets Content-Type but may still return HTML structure).
          schema:
            type: string
            enum: [html, rss, xml]
      responses:
        '200':
          description: Search results
          content:
            text/html:
              schema:
                type: string

  /ogpreview.cgi:
    get:
      summary: Open Graph Preview
      description: Fetches a URL and extracts Open Graph and Twitter Card metadata.
      parameters:
        - name: url
          in: query
          description: The URL to inspect.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JSON object containing extracted metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
            description: Error fetching or parsing URL.
            content:
                application/json:
                    schema:
                        type: object

  /irclink/index.cgi:
    get:
      summary: Redirect to Link
      description: Increments click count and redirects to the target URL.
      parameters:
        - name: id
          in: query
          description: The ircLinkID to redirect to (passed as query string without key, e.g. ?123).
          schema:
             type: integer
      responses:
        '302':
           description: Redirect to target URL.

    post:
      summary: Submit Link
      description: Submits a new link to the Tumblelog.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - user
                - url
              properties:
                user:
                  type: string
                  description: Username of the submitter.
                url:
                  type: string
                  description: The URL to submit.
                source:
                  type: string
                  enum: [irc]
                  description: If set to 'irc', returns raw ID instead of HTML redirect page.
      responses:
         '200':
            description: Success
            content:
               text/plain:
                 schema:
                   type: string
                   description: ID of created link (if source=irc) or '0' on failure.
               text/html:
                 schema:
                   type: string
                   description: HTML confirmation page (default).

  /quote/index.cgi:
    post:
      summary: Submit Quote
      description: Submits a new quote to the Tumblelog.
      requestBody:
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                required:
                  - quote
                  - author
                properties:
                  quote:
                    type: string
                    description: The quote content (URI encoded).
                  author:
                    type: string
                    description: The author of the quote (URI encoded).
      responses:
         '200':
            description: Success
            content:
               text/plain:
                 schema:
                   type: string
                   example: "1"

