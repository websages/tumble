name: Run Tests

on:
  push:
    branches: [ "production", "main" ]
  pull_request:
    branches: [ "production", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run Tests
      run: make test
