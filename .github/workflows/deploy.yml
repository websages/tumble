name: Deploy

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build for Linux amd64
        run: make build-linux

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: tumble.wcyd.org
          DEPLOY_USER: tumble
          DEPLOY_PATH: /srv/tumble/bin/tumble
        run: |
          # Set up SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          # Copy binary to server
          scp -i ~/.ssh/id_deploy bin/tumble-linux-amd64 ${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/tumble.new

          # Replace binary and restart
          ssh -i ~/.ssh/id_deploy ${DEPLOY_USER}@${DEPLOY_HOST} << 'EOF'
            mv /srv/tumble/bin/tumble /srv/tumble/bin/tumble.old
            mv /tmp/tumble.new /srv/tumble/bin/tumble
            chmod +x /srv/tumble/bin/tumble
            sudo systemctl restart tumble
          EOF

      - name: Notify IRC
        if: success()
        env:
          IRC_PASSWORD: ${{ secrets.IRC_PASSWORD }}
        run: |
          sudo apt-get install -y -qq ncat > /dev/null 2>&1
          COMMIT_MSG=$(git log -1 --pretty=%s)
          {
            sleep 1
            printf "PASS %s\r\n" "$IRC_PASSWORD"
            printf "NICK tumble-deploy\r\n"
            printf "USER tumble-deploy 0 * :Tumble Deploy Bot\r\n"
            sleep 3
            printf "JOIN #heathsmom\r\n"
            sleep 2
            printf "PRIVMSG #heathsmom :Tumble deployed: %.7s - %s\r\n" "$GITHUB_SHA" "$COMMIT_MSG"
            sleep 1
            printf "QUIT :Done\r\n"
            sleep 1
          } | ncat --ssl 72.14.177.235 8080 || true
