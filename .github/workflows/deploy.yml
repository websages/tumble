name: Deploy

# main deploys the tumble-wcyd Fly app (tumble.wcyd.org, behind the
# websages/tumble-edge Caddy app). The stahnma branch deploys tumble2
# via deploy-fly.yml.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-wcyd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          # Deploy token scoped to this app:
          #   fly tokens create deploy -a tumble-wcyd
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WCYD }}
        run: make deploy FLY=flyctl

      - name: Notify IRC
        if: success()
        env:
          IRC_PASSWORD: ${{ secrets.IRC_PASSWORD }}
        run: |
          sudo apt-get install -y -qq ncat > /dev/null 2>&1
          COMMIT_MSG=$(git log -1 --pretty=%s)
          {
            sleep 1
            printf "PASS tumble-deploy:%s\r\n" "$IRC_PASSWORD"
            printf "NICK tumble-deploy\r\n"
            printf "USER tumble-deploy 0 * :Tumble Deploy Bot\r\n"
            sleep 3
            printf "JOIN #heathsmom\r\n"
            sleep 2
            printf "PRIVMSG #heathsmom :Tumble deployed: %.7s - %s\r\n" "$GITHUB_SHA" "$COMMIT_MSG"
            sleep 1
            printf "QUIT :Done\r\n"
            sleep 1
          } | ncat --ssl 72.14.177.235 8080 || true
