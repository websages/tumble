# Litestream configuration for continuous replication to S3-compatible
# object storage (Fly.io Tigris). Values are expanded from the environment;
# on Fly these are provisioned by `fly storage create`.
#
#   BUCKET_NAME           - target bucket
#   AWS_ENDPOINT_URL_S3   - https://fly.storage.tigris.dev
#   AWS_REGION            - auto
#   AWS_ACCESS_KEY_ID     - read automatically by the S3 replica
#   AWS_SECRET_ACCESS_KEY - read automatically by the S3 replica
dbs:
  - path: ${TUMBLE_DATABASE}
    replicas:
      - type: s3
        bucket: ${BUCKET_NAME}
        path: tumble
        endpoint: ${AWS_ENDPOINT_URL_S3}
        region: ${AWS_REGION}
