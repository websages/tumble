<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
    <title>tumblefish.stats</title>
    <link rel="stylesheet" href="/css/screen.css" type="text/css" media="screen" />
    <style>
        table.stats {
            width: 100%;
            border-collapse: collapse;
        }
        table.stats th, table.stats td {
            text-align: left;
            padding: 5px;
            border-bottom: 1px solid #ccc;
            font-size: 18px;
        }
        [data-theme="dark"] table.stats td {
            border-bottom: 1px solid #444;
        }
        table.stats th a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }
        table.stats th a:hover {
            color: var(--link-color);
            text-decoration: underline;
        }
    </style>
    <!-- Theme Init -->
    <script>
      (function () {
        var savedTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
</head>
<body>
    <div id="page">
        <div id="masthead">
            <a href="/">tumblefish.</a>
            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>

        <div id="sidebar">
            <div class="item">
                <div class="header">search it up</div>
                <form action="/search.cgi" id="search-form" method="get">
                    <input type="text" id="search" name="search" value="" size="15" />
                </form>
            </div>
            <div class="item">
                <div class="header">also</div>
                <div class="sm">
                    <div class="link"><a href="/">home</a></div>
                </div>
            </div>
        </div>

        <div id="content">
            <div class="item">
                <div class="header">User Stats</div>
                <table class="stats">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th><a href="?sort=user">User</a></th>
                            <th><a href="?sort=links">Links Posted</a></th>
                            <th><a href="?sort=quotes">Quotes Posted</a></th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .Stats}}
                        <tr>
                            <td>{{.Rank}}</td>
                            <td class="author"><a href="/?poster={{.User}}">{{.User}}</a></td>
                            <td>{{.LinkCount}}</td>
                            <td>{{.QuoteCount}}</td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>

            <div id="navigation" style="display: flex; justify-content: space-between; margin-top: 20px;">
                {{if .PrevPage}}
                <a href="?page={{.PrevPage}}&sort={{$.Sort}}"><img src="/img/prev.png" border="0" alt="Previous" /></a>
                {{else}}
                <div></div>
                {{end}}

                {{if .HasNext}}
                <a href="?page={{.NextPage}}&sort={{$.Sort}}"><img src="/img/next.png" border="0" alt="Next" /></a>
                {{end}}
            </div>
        </div>

    </div>
    {{template "footer" .}}
    <!-- Theme Toggle Logic -->
    <script>
      (function () {
        var toggle = document.getElementById("theme-toggle");
        var html = document.documentElement;

        toggle.addEventListener("click", function () {
          if (html.getAttribute("data-theme") === "dark") {
            html.removeAttribute("data-theme");
            localStorage.setItem("theme", "light");
          } else {
            html.setAttribute("data-theme", "dark");
            localStorage.setItem("theme", "dark");
          }
        });
      })();
    </script>
</body>
</html>
