<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
    <title>tumblefish.stats</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="/css/screen.css" type="text/css" media="screen" />
    <style>



        table.stats {
            width: 100%;
            border-collapse: collapse;
        }
        table.stats th, table.stats td {
            text-align: left;
            padding: 5px;
            border-bottom: 1px solid #ccc;
            font-size: 18px;
        }
        [data-theme="dark"] table.stats td {
            border-bottom: 1px solid #444;
        }
        table.stats th a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }
        table.stats th a:hover {
            color: var(--link-color);
            text-decoration: underline;
        }
    </style>
    <!-- Theme Init -->
    <script>
      (function () {
        var savedTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
</head>
<body>
{{template "header" .}}

    <div id="page">




        <div id="content">
            <div class="item">
                <div class="header">User Stats</div>
                <table class="stats">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th><a href="?sort=user">User</a></th>
                            <th><a href="?sort=links">Links Posted</a></th>
                            <th><a href="?sort=quotes">Quotes Posted</a></th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .Stats}}
                        <tr>
                            <td>{{.Rank}}</td>
                            <td class="author"><a href="/?poster={{.User}}">{{.User}}</a></td>
                            <td>{{.LinkCount}}</td>
                            <td>{{.QuoteCount}}</td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>

            <div id="navigation" style="display: flex; justify-content: space-between; margin-top: 20px;">
                {{if .PrevPage}}
                <a href="?page={{.PrevPage}}&sort={{$.Sort}}"><img src="/img/prev.png" border="0" alt="Previous" /></a>
                {{else}}
                <div></div>
                {{end}}

                {{if .HasNext}}
                <a href="?page={{.NextPage}}&sort={{$.Sort}}"><img src="/img/next.png" border="0" alt="Next" /></a>
                {{end}}
            </div>
        </div>

    </div>
    {{template "footer" .}}

</body>
</html>
