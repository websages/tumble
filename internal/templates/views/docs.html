<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tumble API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    (function () {
      var savedTheme = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
    /* Footer Variables from screen.css */
    --footer-bg: #f5f5f5;
    --footer-border: #eee;
    --footer-text: #666;
    --footer-link: #444;
    --icon-fill: #000000;
  }
  [data-theme="dark"] {
    --bg-color: #0d1117;
    --text-color: #c9d1d9;

    /* Footer Variables from screen.css */
    --footer-bg: #1a1a1a;
    --footer-border: #333;
    --footer-text: #888;
    --footer-link: #aaa;
    --icon-fill: #ffffff;
  }
  body { margin: 0; padding: 0 0 60px 0; display: flex; flex-direction: column; min-height: 100vh; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); }
  #swagger-ui { flex: 1; }

  /* Footer Styles */

    /* Footer Styles */
    #footer {
      padding: 10px;
      text-align: center;
      background: var(--footer-bg);
      border-top: 1px solid var(--footer-border);
      font-size: 12px;
      color: var(--footer-text);
      font-family: sans-serif;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 100;
    }
    #footer a {
      color: var(--footer-link);
      text-decoration: none;
    }
    #footer a:hover {
      text-decoration: underline;
    }
    #footer svg {
        fill: var(--icon-fill);
    }




    /* Dark Mode for Swagger UI */
    [data-theme="dark"] #swagger-ui {
        filter: invert(88%) hue-rotate(180deg);
    }
  </style>
</head>
<body>

{{template "header" .}}

<div id="swagger-ui"></div>

{{template "footer" .}}

<script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: '/api/openapi.json',
      dom_id: '#swagger-ui',
    });
  };


</script>
</body>
</html>
