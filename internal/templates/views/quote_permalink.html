<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
  <head>
    <title>{{siteName}}.{{.PageTitle}}</title>
    <link
      rel="stylesheet"
      href="/css/screen.css"
      media="screen"
    />
{{template "theme_head" .}}
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <link rel="canonical" href="{{.BaseURL}}/quote/{{.ID}}" />

    <!-- Theme Init -->
    <script>
      (function () {
        var savedTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }

        // Compact Mode Init
        var isCompact = localStorage.getItem("compact") === "true";
        if (isCompact) {
            document.documentElement.classList.add("compact-mode");
        }

        // Scott Mode Init
        var isScottMode = {{if not themeName}}localStorage.getItem("scottMode") === "true"{{else}}false{{end}}; // Scott Mode is default-look only
        if (isScottMode) {
          document.documentElement.setAttribute("data-scott-mode", "true");
          document.documentElement.removeAttribute("data-theme");
        }

        // Font loading detection
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() {
            document.documentElement.classList.add("fonts-loaded");
          });
        } else {
          setTimeout(function() {
            document.documentElement.classList.add("fonts-loaded");
          }, 100);
        }
      })();
    </script>
  </head>

  <body>
{{template "header" .}}
    <div id="page">
{{template "masthead" .}}

      <div id="content" style="max-width: 600px; margin: 40px auto;">
        <div class="item">
          <blockquote class="quote-card">
            <div class="quote-text">{{.Quote}}</div>
            {{if .Author}}<div class="quote-author">{{.Author}}</div>{{end}}
          </blockquote>
        </div>
      </div>
    </div>

{{template "footer" .}}
  </body>
</html>
