    <div class="item" data-item-type="quote">
        <time class="item-time" datetime="{{.Timestamp.Format "2006-01-02T15:04:05Z07:00"}}">{{.Timestamp.Format "15:04"}}</time>
        <a href="/quote/{{.ID}}" class="quote-link">
            <blockquote class="quote-card">
                <div class="quote-text">{{.Quote}}</div>
                {{if .Author}}<div class="quote-author">{{.Author}}</div>{{end}}
            </blockquote>
        </a>
    </div>
