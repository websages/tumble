<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
  <head>
    <title>tumblefish.{{.PageTitle}}</title>
    <link
      rel="stylesheet"
      href="/css/screen.css"
      type="text/css"
      media="screen"
    />

    <!-- Theme Init -->
    <script>
      (function () {
        var savedTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Twitter Cards -->
    <script>
      !(function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0],
          p = /^http:/.test(d.location) ? "http" : "https";
        if (!d.getElementById(id)) {
          js = d.createElement(s);
          js.id = id;
          js.src = p + "://platform.twitter.com/widgets.js";
          fjs.parentNode.insertBefore(js, fjs);
        }
      })(document, "script", "twitter-wjs");
    </script>

    <!-- Open Graph Preview Loader -->
    <script type="text/javascript">
      (function () {
        function loadOGPreview(item) {
          var url = item.getAttribute("data-url");
          var contentType = item.getAttribute("data-content-type");
          var previewDiv = item.querySelector(".og-preview");

          // Only load preview for non-image content (text/html)
          if (!url || (contentType && contentType.match(/image/))) {
            return;
          }

          // Skip OG preview for YouTube links (they're embedded directly)
          if (url.match(/youtube\.com|youtu\.be/i)) {
            return;
          }

          // Ensure URL has protocol
          if (!url.match(/^https?:\/\//)) {
            url = "http://" + url;
          }

          // Create preview endpoint URL
          var previewUrl = "/ogpreview.cgi?url=" + encodeURIComponent(url);

          // Load preview asynchronously
          var xhr = new XMLHttpRequest();
          xhr.open("GET", previewUrl, true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
              try {
                var data = JSON.parse(xhr.responseText);
                if (data.error) {
                  return;
                }

                // Use Open Graph image, Twitter image, or nothing
                var imageUrl = data.image || data.twitter_image || null;
                // Use Open Graph title, Twitter title, or fallback title
                var title = data.title || data.twitter_title || null;
                // Use Open Graph description, Twitter description, or fallback description
                var description =
                  data.description || data.twitter_description || null;

                // Only show preview if we have at least an image, title, or description
                if (!imageUrl && !title && !description) {
                  return;
                }

                // Build preview HTML
                var previewHTML = '<div class="og-card">';

                // Site Info (Icon + Name)
                var provider = data.provider_name || "Link";
                var iconUrl = "/favicon.ico";
                if (provider === "Reddit")
                  iconUrl =
                    "https://www.redditstatic.com/desktop2x/img/favicon/favicon-32x32.png";

                previewHTML +=
                  '<div class="og-site-info"><img src="' +
                  iconUrl +
                  '" class="og-site-icon" /> ' +
                  escapeHtml(provider) +
                  "</div>";

                // Title
                if (title) {
                  previewHTML +=
                    '<div class="og-title"><a href="' +
                    escapeHtml(url) +
                    '" target="_blank">' +
                    escapeHtml(title) +
                    "</a></div>";
                }

                // Description
                if (description) {
                  if (description.length > 300) {
                    description = description.substring(0, 300) + "...";
                  }
                  previewHTML +=
                    '<div class="og-description">' +
                    escapeHtml(description) +
                    "</div>";
                }

                // Image
                if (imageUrl) {
                  var imageContent =
                    '<img src="' + escapeHtml(imageUrl) + '" alt="" />';
                  var onClickAttr = '';

                  // If it's a video, add the play button overlay
                  if (data.type === "video") {
                    imageContent += '<div class="og-play-button"></div>';
                    onClickAttr = 'onclick="replaceWithVideo(this)"';
                  }

                  previewHTML +=
                    '<div class="og-image ' +
                    (data.type === "video" ? "is-video" : "") +
                    '" ' + onClickAttr + '>' +
                    imageContent +
                    "</div>";
                }

                previewHTML += "</div>";

                previewDiv.innerHTML = previewHTML;
              } catch (e) {
                // Silently fail if JSON parsing fails
              }
            }
          };
          xhr.send();
        }

        function escapeHtml(text) {
          var div = document.createElement("div");
          div.textContent = text;
          return div.innerHTML;
        }

        // Global handler for video replacemen
        window.replaceWithVideo = function(container) {
            // Find URL from parent item
            var item = container.closest('.item');
            if (!item) return;
            var url = item.getAttribute('data-url');
            if (!url) return;

            var videoID = '';
            var match = url.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            if (match) {
                videoID = match[1];
            } else {
                 // Try query param scan too
                 var match2 = url.match(/v=([a-zA-Z0-9_-]{11})/);
                 if (match2) videoID = match2[1];
            }

            if (videoID) {
                var iframe = '<div class="youtube-embed-wrapper"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/' + videoID + '?autoplay=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
                container.innerHTML = iframe;
                container.onclick = null; // Remove handler
                container.classList.remove('is-video');
                container.style.cursor = 'default';
            }
        };

        // Load all previews when DOM is ready
        function initOGPreviews() {
          var items = document.querySelectorAll(".item[data-url]");
          for (var i = 0; i < items.length; i++) {
            loadOGPreview(items[i]);
          }
        }

        // Run when DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initOGPreviews);
        } else {
          initOGPreviews();
        }
      })();
    </script>
  </head>

  <body>
    <div id="page">
      <div id="masthead">
        <a href="/">tumblefish.</a>
        <button id="theme-toggle" aria-label="Toggle Dark Mode">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <div id="sidebar">
        <div class="item">
          <div class="header">search it up</div>
          <form action="/search.cgi" id="search-form" method="get">
            <input type="text" id="search" name="search" value="" size="15" />
          </form>
        </div>
        <div class="item">
          <div class="header">last week's hot shit</div>
          {{.Hot}}
        </div>
        <div class="item">
          <div class="header">also</div>
          <div class="sm">
            <div class="link"><a href="/buttons/">buttons</a></div>
          </div>
          <div class="sm">
            <div class="link"><a href="/index.xml">feed</a></div>
          </div>
        </div>
      </div>

      <div id="content">
        {{if .Poster}}
        <div class="item" style="font-size: 14px; margin-bottom: 20px;">
            Filter:
            <a href="/?poster={{.Poster}}" style="{{if eq .FilterType ""}}font-weight: bold; color: var(--text-main);{{else}}color: var(--link-color);{{end}}">All</a> |
            <a href="/?poster={{.Poster}}&type=links" style="{{if eq .FilterType "links"}}font-weight: bold; color: var(--text-main);{{else}}color: var(--link-color);{{end}}">Links</a> |
            <a href="/?poster={{.Poster}}&type=quotes" style="{{if eq .FilterType "quotes"}}font-weight: bold; color: var(--text-main);{{else}}color: var(--link-color);{{end}}">Quotes</a>
        </div>
        {{end}}
        {{.Container}}
      </div>

      <div id="navigation">{{.NavP}} {{.NavN}}</div>
    </div>

    <div id="footer">
      <a href="/stats">Stats</a>
      &nbsp;|&nbsp;
      Source Code Available on
      <a href="http://github.com/websages/tumble">GitHub</a>
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="#000000"
        style="vertical-align: text-bottom; display: inline-block"
      >
        <path
          fill-rule="evenodd"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
        ></path></svg
      >. {{if .GitCommit}} Revision:
      <a href="{{.GitCommitURL}}">{{.GitCommit}}</a>{{end}}
    </div>

    <!-- Theme Toggle Logic -->
    <script>
      (function () {
        var toggle = document.getElementById("theme-toggle");
        var html = document.documentElement;

        toggle.addEventListener("click", function () {
          if (html.getAttribute("data-theme") === "dark") {
            html.removeAttribute("data-theme");
            localStorage.setItem("theme", "light");
          } else {
            html.setAttribute("data-theme", "dark");
            localStorage.setItem("theme", "dark");
          }
        });
      })();
    </script>
  </body>
</html>
