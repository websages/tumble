<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
  <head>
    <title>tumblefish.{{.PageTitle}}</title>
    <link
      rel="stylesheet"
      href="/css/screen.css"
      media="screen"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Theme Init -->
    <script>
      (function () {
        var savedTheme = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Twitter Cards -->
    <script>
      !(function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0],
          p = /^http:/.test(d.location) ? "http" : "https";
        if (!d.getElementById(id)) {
          js = d.createElement(s);
          js.id = id;
          js.src = p + "://platform.twitter.com/widgets.js";
          fjs.parentNode.insertBefore(js, fjs);
        }
      })(document, "script", "twitter-wjs");
    </script>

    <!-- Open Graph Preview Loader -->
    <script type="text/javascript">
      (function () {
        function loadOGPreview(item) {
          var url = item.getAttribute("data-url");
          var contentType = item.getAttribute("data-content-type");
          var previewDiv = item.querySelector(".og-preview");

          // Only load preview for non-image content (text/html)
          if (!url || (contentType && contentType.match(/image/))) {
            return;
          }

          // Ensure URL has protocol
          if (!url.match(/^https?:\/\//)) {
            url = "http://" + url;
          }

          // Create preview endpoint URL
          var previewUrl = "/ogpreview.cgi?url=" + encodeURIComponent(url);

          // Load preview asynchronously
          var xhr = new XMLHttpRequest();
          xhr.open("GET", previewUrl, true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                try {
                  var data = JSON.parse(xhr.responseText);
                  handlePreviewData(data);
                } catch (e) {
                  // Silently fail or remove
                  previewDiv.remove();
                }
              } else {
                previewDiv.remove();
              }
            }
          };
          xhr.send();

          function handlePreviewData(data) {
             // Handle Errors
             if (data.error || (data.status && data.status >= 400)) {
                var status = data.status || 404;
                var linkSpan = item.querySelector(".link");
                if (linkSpan) {
                     var statusPrefix = '<span class="http-error-badge">' + status + '</span> ';
                     linkSpan.innerHTML = '<a href="' + escapeHtml(url) + '" class="missing-link" target="_blank">' + statusPrefix + escapeHtml(url) + '</a>';
                }
                previewDiv.remove();
                return;
             }

             // Client-side OEmbed Fallback (TikTok)
             // If missing embed_html but is TikTok, fetch from TikTok's OEmbed endpoint directly.
             if (!data.embed_html && url.match(/tiktok\.com/)) {
                  var oembedUrl = 'https://www.tiktok.com/oembed?url=' + encodeURIComponent(url) + '&format=json';
                  fetch(oembedUrl)
                      .then(function(response) {
                          if (response.ok) return response.json();
                          throw new Error('Client-side OEmbed failed');
                      })
                      .then(function(oembedData) {
                          if (oembedData.html) data.embed_html = oembedData.html;
                          if (oembedData.thumbnail_url) data.image = oembedData.thumbnail_url;
                          if (oembedData.title) data.title = oembedData.title;
                          if (oembedData.provider_name) data.provider_name = oembedData.provider_name;
                          data.type = "video";
                          renderPreview(data);
                      })
                      .catch(function(e) {
                          console.log("Fallback failed", e);
                          renderPreview(data);
                      });
                  return;
             }

             renderPreview(data);
          }

          function renderPreview(data) {
                // Use Open Graph image, Twitter image, or nothing
                var imageUrl = data.image || data.twitter_image || null;
                var title = data.title || data.twitter_title || null;
                var description = data.description || data.twitter_description || null;

                // Only show preview if we have at least an image, title, or description
                if (!imageUrl && !title && !description && !data.embed_html) {
                  return;
                }

                // Build preview HTML
                var previewHTML = '<div class="og-card">';

                // Site Info (Icon + Name)
                var provider = data.provider_name || "Link";
                var iconUrl = data.icon || "/favicon.ico";
                if (provider === "Reddit" && !data.icon)
                  iconUrl = "https://www.redditstatic.com/desktop2x/img/favicon/favicon-32x32.png";

                previewHTML +=
                  '<div class="og-site-info"><img src="' +
                  escapeHtml(iconUrl) +
                  '" class="og-site-icon" /> ' +
                  escapeHtml(provider) +
                  "</div>";

                // Image
                if (imageUrl) {
                  var imageContent = '<img src="' + escapeHtml(imageUrl) + '" alt="" />';
                  var onClickAttr = '';

                  // If it's a video, add the play button overlay
                  if (data.type === "video" || data.type === "rich") {
                    imageContent += '<div class="og-play-button"></div>';
                    onClickAttr = 'onclick="replaceWithVideo(this)"';
                  }

                  var embedHtmlAttr = '';
                  if (data.embed_html) {
                      embedHtmlAttr = ' data-embed-html="' + encodeURIComponent(data.embed_html) + '"';
                  }

                  previewHTML +=
                    '<div class="og-image ' +
                    (data.type === "video" || data.type === "rich" ? "is-video" : "") +
                    '" ' + onClickAttr + embedHtmlAttr + '>' +
                    imageContent +
                    "</div>";
                }

                // Text Conten
                previewHTML += '<div class="og-content">';
                if (title) {
                  previewHTML +=
                    '<div class="og-title"><a href="' +
                    escapeHtml(url) +
                    '" target="_blank">' +
                    escapeHtml(title) +
                    "</a></div>";
                }
                if (description) {
                  if (description.length > 300) {
                    description = description.substring(0, 300) + "...";
                  }
                  previewHTML +=
                    '<div class="og-description">' +
                    escapeHtml(description) +
                    "</div>";
                }
                previewHTML += "</div>"; // end og-conten
                previewHTML += "</div>"; // end og-card

                previewDiv.innerHTML = previewHTML;

                // Auto-expand Reddit and Spotify embeds to provide "richer view out of the box"
                // The custom card acts as a placeholder or fallback, but we trigger the embed swap immediately.
                if ((provider === "Reddit" || provider === "Spotify") && data.embed_html) {
                    var imgDiv = previewDiv.querySelector('.og-image.is-video');
                    if (imgDiv) {
                       // Small delay to ensure render? No, synchronous is fine for DOM,
                       // but we need to ensure the scripts run. replaceWithVideo handles that.
                       window.replaceWithVideo(imgDiv);
                    }
                }
          }
        }

        function escapeHtml(text) {
          var div = document.createElement("div");
          div.textContent = text;
          return div.innerHTML;
        }

        // Global handler for video replacemen
        window.replaceWithVideo = function(container) {
            // Check for pre-fetched embed HTML
            var embedHtmlEncoded = container.getAttribute('data-embed-html');
            if (embedHtmlEncoded) {
                var embedHtml = decodeURIComponent(embedHtmlEncoded);
                container.innerHTML = embedHtml;
                container.onclick = null;
                container.classList.remove('is-video');
                container.style.cursor = 'default';

                // Manually execute scripts (innerHTML does not execute them)
                var scripts = container.getElementsByTagName('script');
                for (var i = 0; i < scripts.length; i++) {
                    var oldScript = scripts[i];
                    var newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                        newScript.async = true; // Most embeds need async
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                }
                return;
            }

            // Find URL from parent item
            var item = container.closest('.item');
            if (!item) return;
            var url = item.getAttribute('data-url');
            if (!url) return;

            var videoID = '';
            var match = url.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            if (match) {
                videoID = match[1];
            } else {
                 // Try query param scan too
                 var match2 = url.match(/v=([a-zA-Z0-9_-]{11})/);
                 if (match2) videoID = match2[1];
            }

            if (videoID) {
                var iframe = '<div class="youtube-embed-wrapper"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/' + videoID + '?autoplay=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
                container.innerHTML = iframe;
                container.onclick = null; // Remove handler
                container.classList.remove('is-video');
                container.style.cursor = 'default';
            }
        };

        // Load all previews when DOM is ready
        function initOGPreviews() {
          var items = document.querySelectorAll(".item[data-url]");
          for (var i = 0; i < items.length; i++) {
            loadOGPreview(items[i]);
          }
        }

        // Run when DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initOGPreviews);
        } else {
          initOGPreviews();
        }
      })();
    </script>
  </head>

  <body>
{{template "header" .}}
    <div id="page">
      <div id="masthead">
        <a href="/">tumblefish.</a>
      </div>

      <div id="sidebar">
      </div>

      <div id="content">
        {{if .Poster}}
        <div class="item" style="font-size: 14px; margin-bottom: 20px;">
            Filter:
            <a href="/?poster={{.Poster}}" style="{{if eq .FilterType ""}}font-weight: bold; color: var(--text-main);{{else}}color: var(--link-color);{{end}}">All</a> |
            <a href="/?poster={{.Poster}}&type=links" style="{{if eq .FilterType "links"}}font-weight: bold; color: var(--text-main);{{else}}color: var(--link-color);{{end}}">Links</a> |
            <a href="/?poster={{.Poster}}&type=quotes" style="{{if eq .FilterType "quotes"}}font-weight: bold; color: var(--text-main);{{else}}color: var(--link-color);{{end}}">Quotes</a>
        </div>
        {{end}}
        {{if .IsFallbackContent}}
        <div class="item" style="border: 1px solid var(--og-border); padding: 15px; margin-bottom: 20px; background-color: var(--footer-bg); border-radius: 4px; text-align: center;">
            <div style="font-weight: bold; margin-bottom: 5px; font-size: 18px;">It's been a bit quiet lately...</div>
            <div style="font-size: 14px;">Here is some content from the archives. Why not <a href="/buttons/" style="font-weight: bold; color: var(--link-color);">share something new</a>?</div>
        </div>
        {{end}}
        {{.Container}}
      </div>

      <div id="navigation">{{.NavP}} {{.NavN}}</div>
    </div>

    {{template "footer" .}}


  </body>
</html>
