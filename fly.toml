# fly.toml — Tumble deployment
# Docs: https://fly.io/docs/reference/configuration/
#
# main deploys the tumble-wcyd app (tumble.wcyd.org) on push. The app is
# private: it has only a Flycast address and is reached through the
# shared Caddy edge (websages/tumble-edge), which holds the public
# hostnames, TLS certificates and bot filtering.
#
# The stahnma branch carries its own fly.toml for the tumble2 app
# (feed.stahnma.us).

app = "tumble-wcyd"
primary_region = "iad"

# Built from the Dockerfile, which bundles tumble + the Litestream binary.
# Pass the commit hash for the version banner at deploy time:
#   fly deploy --build-arg GIT_COMMIT="$(git rev-parse --short HEAD)"
[build]

# All non-secret configuration is supplied via TUMBLE_* env vars.
# Secrets (set with `fly secrets set`): TUMBLE_ADMIN_SECRET,
# TUMBLE_CLICK_SIGNING_KEY, TUMBLE_UNFURL_WORKER_URL/_KEY. Object-storage
# credentials for Litestream (BUCKET_NAME, AWS_*) are provisioned by
# `fly storage create`; do not put them here.
[env]
  TUMBLE_DRIVER = "sqlite"
  TUMBLE_DATABASE = "/data/tumble.sqlite"
  TUMBLE_BASEURL = "https://tumble.wcyd.org"
  TUMBLE_PORT = "8080"
  TUMBLE_MODE = "production"
  TUMBLE_LOGGING_LEVEL = "info"
  TUMBLE_LOGGING_OUTPUT = "stdout"
  TUMBLE_CACHING_ENABLED = "true"
  TUMBLE_REQUEST_TIMEOUT = "10s"
  TUMBLE_SITE_TITLE = "tumblefish."
  TUMBLE_SITE_DESCRIPTION = "tumblefish."
  TUMBLE_MANAGING_EDITOR = "scott@loserfish.org (Scott)"
  TUMBLE_WEBMASTER = "scott@loserfish.org (Scott)"
  TUMBLE_COPYRIGHT = "http://creativecommons.org/licenses/by-sa/1.0"

# Persistent volume for the SQLite database. Create it once with:
#   fly volumes create tumble_data --region iad --size 3
[[mounts]]
  source = "tumble_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  # The edge reaches this app over Flycast with plain HTTP and enforces
  # HTTPS itself; redirecting here would loop.
  force_https = false
  # The scheduler runs daily background jobs, so keep one machine alive
  # rather than scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
